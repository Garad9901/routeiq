version: '3.8'

services:
  postgres:
    image: postgis/postgis:15-3.3
    container_name: routeiq-postgres
    environment:
      POSTGRES_USER: routeiq_user
      POSTGRES_PASSWORD: routeiq_password
      POSTGRES_DB: routeiq_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U routeiq_user -d routeiq_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - routeiq-network

  mongodb:
    image: mongo:6.0
    container_name: routeiq-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - routeiq-network

  redis:
    image: redis:7-alpine
    container_name: routeiq-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - routeiq-network

  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: routeiq-ai-service
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - DATABASE_URL=postgresql://routeiq_user:routeiq_password@postgres:5432/routeiq_db
      - REDIS_URL=redis://redis:6379/0
      - MONGO_URL=mongodb://mongodb:27017/routeiq
      - ENVIRONMENT=production
    depends_on:
      postgres:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - routeiq-network

  backend-gateway:
    build:
      context: ./backend-gateway
      dockerfile: Dockerfile
    container_name: routeiq-backend-gateway
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - DATABASE_URL=postgresql://routeiq_user:routeiq_password@postgres:5432/routeiq_db
      - MONGO_URI=mongodb://mongodb:27017/routeiq
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - JWT_ACCESS_SECRET=super_secret_access_key_12345
      - JWT_REFRESH_SECRET=super_secret_refresh_key_54321
      - AI_SERVICE_URL=http://ai-service:8000
    depends_on:
      postgres:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - routeiq-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: routeiq-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost/api
      - NEXT_PUBLIC_WS_URL=ws://localhost/socket.io
    depends_on:
      - backend-gateway
    networks:
      - routeiq-network

  nginx:
    image: nginx:alpine
    container_name: routeiq-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend-gateway
      - ai-service
    networks:
      - routeiq-network

networks:
  routeiq-network:
    driver: bridge

volumes:
  postgres_data:
  mongodb_data:
  redis_data:
