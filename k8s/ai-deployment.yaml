apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-service-deploy
  labels:
    app: ai-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ai-service
  template:
    metadata:
      labels:
        app: ai-service
    spec:
      containers:
        - name: ai-service
          image: routeiq/ai-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - name: DATABASE_URL
              value: postgresql://routeiq_user:routeiq_password@postgres:5432/routeiq_db
            - name: MONGO_URL
              value: mongodb://mongodb:27017/routeiq
            - name: REDIS_URL
              value: redis://redis:6379/0
            - name: ENVIRONMENT
              value: production
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: ai-service
spec:
  ports:
    - port: 8000
  selector:
    app: ai-service
