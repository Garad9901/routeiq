apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-gateway-deploy
  labels:
    app: backend-gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend-gateway
  template:
    metadata:
      labels:
        app: backend-gateway
    spec:
      containers:
        - name: backend-gateway
          image: routeiq/backend-gateway:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
          env:
            - name: DATABASE_URL
              value: postgresql://routeiq_user:routeiq_password@postgres:5432/routeiq_db
            - name: MONGO_URI
              value: mongodb://mongodb:27017/routeiq
            - name: REDIS_HOST
              value: redis
            - name: REDIS_PORT
              value: 6379
            - name: JWT_ACCESS_SECRET
              value: super_secret_access_key_12345
            - name: JWT_REFRESH_SECRET
              value: super_secret_refresh_key_54321
            - name: AI_SERVICE_URL
              value: http://ai-service:8000
---
apiVersion: v1
kind: Service
metadata:
  name: backend-gateway
spec:
  ports:
    - port: 5000
  selector:
    app: backend-gateway
