name: RouteIQ Enterprise CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  # Job 1: Test & Lint Python AI service
  test-ai-service:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          cd ai-service
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Pytest suite
        run: |
          cd ai-service
          pytest tests/

  # Job 2: Test & Lint Node.js backend gateway
  test-backend-gateway:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend-gateway/package-lock.json

      - name: Install Dependencies
        run: |
          cd backend-gateway
          # Use npm install as lock file is pre-configured
          npm install

      - name: Build Application
        run: |
          cd backend-gateway
          npm run build

  # Job 3: Build & Lint Next.js Frontend
  test-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: |
          cd frontend
          npm install

      - name: Build next.js app
        run: |
          cd frontend
          npm run build

  # Job 4: Dry-run Docker Builds
  docker-dry-run:
    needs: [test-ai-service, test-backend-gateway, test-frontend]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Build AI Service Image
        run: docker build -t routeiq/ai-service:test ./ai-service

      - name: Build Backend Gateway Image
        run: docker build -t routeiq/backend-gateway:test ./backend-gateway

      - name: Build Frontend Image
        run: docker build -t routeiq/frontend:test ./frontend
